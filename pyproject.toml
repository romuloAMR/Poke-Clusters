[project]
name = "poke-clusters"
version = "0.1.0"
description = "Unsupervised machine learning techniques applied to Pokémon data"
authors = [
    {name = "Rômulo Alves de Morais Rocha"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=1.26.0,<2.0.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "seaborn (>=0.13.0,<0.14.0)",
    "notebook (>=7.0.0,<8.0.0)",
    "jupyterlab (>=4.0.0,<5.0.0)",
    "scipy (>=1.10.0,<2.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "sentence-transformers (>=5.2.0,<6.0.0)",
    "yellowbrick (>=1.5,<2.0)",
    "plotly (>=6.5.0,<7.0.0)" 
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
